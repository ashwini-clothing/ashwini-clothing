services:
  - type: web
    name: ashwini-clothing
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/ashwini.db
      - key: EMAIL_PROVIDER
        value: resend
      - key: ADMIN_EMAIL
        value: ashwiniweb88@gmail.com
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
    disk:
      name: ashwini-data
      mountPath: /var/data
      sizeGB: 1
