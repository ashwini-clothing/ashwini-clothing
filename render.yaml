services:
  - type: web
    name: ashwini-clothing
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/ashwini.db
      - key: EMAIL_PROVIDER
        value: resend
      - key: ADMIN_EMAIL
        value: ashwiniweb88@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MSG91_WIDGET_ID
        value: 3668776a6531353432363138
      - key: MSG91_WIDGET_TOKEN
        sync: false
      - key: MSG91_AUTHKEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: PUBLIC_SITE_URL
        value: https://ashwiniweb.com
    disk:
      name: ashwini-data
      mountPath: /var/data
      sizeGB: 1
