services:
  - type: web
    name: ashwini-clothing
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/ashwini.db
    disk:
      name: ashwini-data
      mountPath: /var/data
      sizeGB: 1
